run:
  tests: false
  issues:
    exclude-dirs:
      - vendor
    exclude-files:
      - \.pb\.go$
      - \.pb\.validate\.go$
      - \.pb\.gw\.go$

linters-settings:
  dupl:
    threshold: 500
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/golangci/golangci-lint)
  lll:
    line-length: 160
  depguard:
    rules:
      main:
        allow:
          - "isuct.ru/informatics2022/labs/lab4"
          - "isuct.ru/informatics2022/labs/lab6"
          - "isuct.ru/informatics2022/labs/lab7"
          - "isuct.ru/informatics2022/labs/lab8"
          - "isuct.ru/informatics2022/labs/lab9"
          - "fmt"  # Разрешение для стандартной библиотеки

linters:
  disable-all: true
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - decorder
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - errchkjson
    - errorlint
    - forcetypeassert
    - gocognit
    - goconst
    - gocyclo
    - goheader
    - gomodguard
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - grouper
    - importas
    - ineffassign
    - lll
    - makezero
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nosprintfhostport
    - paralleltest
    - promlinter
    - rowserrcheck
    - sqlclosecheck
    - tenv
    - testpackage
    - tparallel
    - typecheck
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace

issues:
  exclude-rules:
    - path: _test\.go$
      linters:
        - gomnd
    - text: "File is not `goimports`-ed with -local github.com/golangci/golangci-lint"
      linters:
        - goimports  
